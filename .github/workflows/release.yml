name: Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - docs/known-findings.md
      - images/**
      - scripts/**
      - tests/**
      - tools/**
      - Makefile
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: python-runtime-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release Python images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_NAME: ghcr.io/r055le/runtime-python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false

      - name: Build and verify exact images
        run: make ci

      - name: Inspect release history
        id: release
        run: |
          release_id=$(<build/release-id)
          tag="python-3.14-${release_id}"
          gh release list --limit 100 --json tagName,publishedAt >build/releases.json
          if jq -e --arg tag "$tag" '.[] | select(.tagName == $tag)' \
              build/releases.json >/dev/null; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi
          previous_tag=$(jq -r --arg tag "$tag" \
              '[.[] | select(.tagName != $tag)][0].tagName // empty' \
              build/releases.json)
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >>"$GITHUB_OUTPUT"

      - name: Stop when the exact release already exists
        if: steps.release.outputs.exists == 'true'
        run: echo "${{ steps.release.outputs.tag }} already exists after a clean validation."

      - name: Download prior package locks
        if: >-
          steps.release.outputs.exists != 'true' &&
          steps.release.outputs.previous_tag != ''
        run: |
          mkdir -p build/previous
          gh release download "${{ steps.release.outputs.previous_tag }}" \
            --pattern 'python-3.14.*.lock.json' \
            --dir build/previous

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.exists != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable images
        if: steps.release.outputs.exists != 'true'
        id: publish
        run: |
          ./scripts/publish-immutable.sh
          cat build/published.env >>"$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.release.outputs.exists != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign immutable images
        if: steps.release.outputs.exists != 'true'
        run: |
          cosign sign --yes "${{ steps.publish.outputs.RUNTIME_REF }}"
          cosign sign --yes "${{ steps.publish.outputs.BUILD_REF }}"

      - name: Attest runtime provenance
        if: steps.release.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.RUNTIME_DIGEST }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest runtime SBOM
        if: steps.release.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.RUNTIME_DIGEST }}
          sbom-path: build/sbom/runtime/sbom-x86_64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance
        if: steps.release.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.BUILD_DIGEST }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest build SBOM
        if: steps.release.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.BUILD_DIGEST }}
          sbom-path: build/sbom/build/sbom-x86_64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Create release manifest
        if: steps.release.outputs.exists != 'true'
        run: |
          ./scripts/release_manifest.py \
            --build-dir build \
            --previous-dir build/previous \
            --source-revision "$GITHUB_SHA" \
            --image "${{ steps.publish.outputs.IMAGE_NAME }}" \
            --runtime-digest "${{ steps.publish.outputs.RUNTIME_DIGEST }}" \
            --build-digest "${{ steps.publish.outputs.BUILD_DIGEST }}" \
            --output build/release-manifest.json \
            --notes-output build/release-notes.md

      - name: Promote rolling tags
        if: steps.release.outputs.exists != 'true'
        run: ./scripts/promote-images.sh

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        run: |
          mkdir -p build/release-assets
          cp build/python-3.14.*.lock.json build/release-assets/
          cp build/reports/python-3.14.*.trivy.json build/release-assets/
          cp build/release-manifest.json build/release-assets/
          cp build/sbom/runtime/sbom-x86_64.spdx.json \
            build/release-assets/python-3.14.runtime.spdx.json
          cp build/sbom/build/sbom-x86_64.spdx.json \
            build/release-assets/python-3.14.build.spdx.json
          gh release create "${{ steps.release.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Python 3.14 ${{ steps.publish.outputs.RELEASE_ID }}" \
            --notes-file build/release-notes.md \
            build/release-assets/*

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/release-id
            build/*.lock.json
            build/release-manifest.json
            build/reports/
            build/sbom/

  notify:
    name: Report release health
    needs: release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      - name: Open or close the release incident
        run: |
          title='Runtime image release is blocked'
          issue_number=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Runtime image release is blocked") | .number' \
            | head -n 1)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$RELEASE_RESULT" = success ]; then
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "The release path recovered: ${run_url}"
            fi
          elif [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The release path is still blocked: ${run_url}"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "The scheduled or main-branch release path failed: ${run_url}"
          fi
